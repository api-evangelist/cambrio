name: Cambrio
description: 'Cambrio is a manufacturing software company, now a Sandvik-owned brand,
  that develops CAD/CAM software for CNC programming and digital manufacturing. Its
  portfolio spans GibbsCAM for CNC milling and turning, SigmaNEST for nesting and material
  optimization, and Cimatron for integrated tooling and mold design. Cambrio serves
  the automotive, aerospace, medical, electronics, and general manufacturing industries.
  It was a Battery Ventures portfolio company before being acquired by Sandvik AB in
  2021. Cambrio is desktop/on-premises manufacturing software and does not currently
  publish a public developer API, developer portal, or OpenAPI surface.'
